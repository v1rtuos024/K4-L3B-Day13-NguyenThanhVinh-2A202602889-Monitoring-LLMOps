service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: 'The existing 3000 ms limit matches the latency dashboard threshold; 99.5% allows 0.5% slow or failed requests. In 10000 requests over 28 days, at most 50 may miss the objective. This is an initial lab target; tune after a representative baseline.'
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
